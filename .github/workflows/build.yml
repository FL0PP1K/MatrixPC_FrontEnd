name: MATRIXPC React Build

on:
  push:
    branches:
      - frontend/React
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug project files
        run: |
          pwd
          ls -la
          git ls-files index.html
          find . -maxdepth 3 -name index.html -not -path './node_modules/*'

      - name: Build React application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrixpc-dist
          path: dist/
