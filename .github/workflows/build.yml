name: MATRIXPC React Build and Deploy

on:
  push:
    branches:
      - frontend/React
      - feature/catalog-auth
  pull_request:
    branches:
      - frontend/React
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/frontend/React'
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Nginx
        run: rsync -rlv --delete --no-perms --no-owner --no-group dist/ /var/www/matrixpc/
